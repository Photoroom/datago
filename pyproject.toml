[project]
name = "datago"
dynamic = ["version"]
authors = [
  { name = "Benjamin Lefaudeux"},
  { name = "Roman Frigg"},
  { name = "Tarek Ayed"},
  { name = "Marco Forte"},
  { name = "Photoroom", email = "team@photoroom.com" }
]
description = "A high performance dataloader for Python, written in Rust"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
  "Programming Language :: Rust",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
]
dependencies = [
    "fonttools>=4.60.2",
    "pillow",
]
[dependency-groups]
test = [
    "pytest",
    "numpy",
    "prek>=0.2.29",
]

dev = [
  "matplotlib",
  "pandas",
  "prek>=0.2.29",
  "typer",
  "torch",
  "torchvision",
  "tqdm",
  "webdataset",
]

[project.urls]
Homepage = "https://github.com/photoroom/datago"
Issues = "https://github.com/photoroom/datago/issues"

[build-system]
requires = ["maturin>=1,<2"]
build-backend = "maturin"
target = "x86_64-unknown-linux-gnu"

[tool.maturin]
# Track cargo release builds
profile = "release"
# Include additional files
include = ["LICENCE", "README.md"]
# Exclude files
exclude = []
# Bindings type
bindings = "pyo3"
# Control the platform tag on linux
compatibility = "linux"
# auditwheel mode, possible values are repair, check and skip
auditwheel = "repair"
# Don't check for manylinux compliance, deprecated in favor of auditwheel = "audit"
skip-auditwheel = false
# Python packages to include
python-packages = []
# Strip the library for minimum file size
strip = true
# Source distribution generator,
# supports cargo (default) and git.
sdist-generator = "cargo"

[tool.uv]
# uv only rebuilds the project when pyproject.toml/setup.py change, so a plain
# `uv run` keeps serving a stale wheel after Rust edits. Track the Cargo inputs
# too, so the extension is rebuilt whenever the compiled sources change.
# (Defining cache-keys replaces the defaults, hence pyproject.toml is listed.)
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "src/**/*.rs" },
]

[tool.ty.rules]
unresolved-import = "ignore"
